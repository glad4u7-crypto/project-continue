[pytest]
# Keep imports stable when tests are run from the repository root.
pythonpath = .
testpaths = tests

# Discover conventional pytest test modules, classes and functions.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Fail fast on misspelled/unregistered markers and show useful skip/xfail details.
addopts = -ra --strict-markers

# Checkpoint-level test classification.
markers =
    unit: isolated unit tests with external dependencies mocked or absent
    integration: tests exercising multiple application components together
    api: HTTP/API contract tests (network calls must be mocked)
    database: SQLite persistence and transaction tests using isolated databases
    acceptance: end-to-end or phase acceptance tests
