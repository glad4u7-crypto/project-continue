name: Phase 13 Memory and Checkpoint Engine
on:
  push:
    branches: ["feature/phase-13-memory-checkpoint-engine"]
  pull_request:
    branches: ["main"]
    paths:
      - "app.py"
      - "ui/**"
      - "services/**"
      - "tests/**"
      - "database/**"
      - "docs/PHASE-13-MEMORY-CHECKPOINT-ENGINE.md"
      - "docs/checkpoints/PC-P13-S001-TO-S008-MEMORY-CHECKPOINT-ENGINE.md"
      - "README.md"
      - ".github/workflows/phase13.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Phase 13
        run: python -m compileall -q app.py ui services/memory_checkpoint_engine.py tests/test_memory_checkpoint_engine.py
      - name: Focused Phase 13 tests
        run: python -m pytest -q tests/test_memory_checkpoint_engine.py
      - name: Full regression suite
        run: python -m pytest -q
