name: Phase 17 Multi-Agent Manager

on:
  push:
    branches: ["feature/phase-17-multi-agent-manager"]
    paths:
      - "services/multi_agent_manager.py"
      - "ui/multi_agent_manager.py"
      - "tests/test_multi_agent_manager.py"
      - "app.py"
      - ".github/workflows/phase17.yml"
  pull_request:
    paths:
      - "services/multi_agent_manager.py"
      - "ui/multi_agent_manager.py"
      - "tests/test_multi_agent_manager.py"
      - "app.py"
      - ".github/workflows/phase17.yml"

permissions:
  contents: read

jobs:
  multi-agent-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Phase 17 modules
        run: python -m compileall -q services/multi_agent_manager.py ui/multi_agent_manager.py tests/test_multi_agent_manager.py app.py
      - name: U01-U04 focused acceptance
        run: python -m pytest -q tests/test_multi_agent_manager.py
      - name: Full regression suite
        run: python -m pytest -q
