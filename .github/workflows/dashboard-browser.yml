name: Dashboard Browser Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: Real Streamlit UI / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      PROJECT_CONTINUE_DB: /tmp/project-continue-browser-ci.sqlite3
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Compile application
        run: python -m compileall -q app.py config.py core database integrations services ui
      - name: Launch Streamlit and test the actual browser UI
        run: python scripts/dashboard_browser_smoke.py
      - name: Upload browser evidence and server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-browser-acceptance
          path: |
            reports/dashboard-browser-smoke.png
            reports/streamlit-browser-smoke.log
          if-no-files-found: warn
          retention-days: 14
