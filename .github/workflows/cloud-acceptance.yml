name: Cloud Acceptance Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: cloud-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Acceptance / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      APP_ENV: test
      PROJECT_CONTINUE_DB: ${{ runner.temp }}/project-continue-ci.sqlite3
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run Phase 06 isolated file-backed acceptance
        run: python scripts/phase06_acceptance.py

      - name: Run Phase 07 intelligent-engine acceptance
        run: python scripts/phase07_acceptance.py

      - name: Run complete test suite and generate reports
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=app --cov=config --cov=core --cov=database \
            --cov=integrations --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-acceptance-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
