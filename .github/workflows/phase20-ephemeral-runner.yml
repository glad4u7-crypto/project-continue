name: Phase 20 Ephemeral Fixed-Task Runner

on:
  push:
    branches: ["phase20/**"]
    paths:
      - "src/dispatcher/**"
      - "schemas/dispatcher/**"
      - "scripts/phase20_runner.py"
      - "tests/test_dispatcher_*.py"
      - "tests/test_phase20_runner.py"
      - "scripts/phase20_test_harness.py"
      - "tests/test_phase20_test_harness.py"
      - "scripts/phase20_notebooks.py"
      - "tests/test_phase20_notebooks.py"
      - "scripts/phase20_notebook_policy.py"
      - "tests/test_phase20_notebook_policy.py"
      - "tests/test_phase20_notebook_sandbox.py"
      - "tests/fixtures/phase20_safe_notebook.ipynb"
      - "docker/phase20-notebook-runner/**"
      - "scripts/phase20_notebook_ci_acceptance.py"
      - "tests/conftest.py"
      - "tests/test_project_dashboard.py"
      - "tests/test_ui_smoke.py"
      - "tests/test_database_repository.py"
      - "tests/test_project_management.py"
      - "scripts/phase20_streamlit_browser_acceptance.py"
      - "services/**"
      - "database/runtime.py"
      - "database/repository.py"
      - "ui/**"
      - "config.py"
      - "app.py"
      - "tests/test_phase20_sqlite_safety.py"
      - "tests/test_phase20_sqlite_backup_recovery.py"
      - "services/backup_operations.py"
      - "database/connection.py"
      - "database/schema.py"
      - "scripts/phase20_notebook_sandbox.py"
      - ".github/workflows/phase20-ephemeral-runner.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/dispatcher/**"
      - "schemas/dispatcher/**"
      - "scripts/phase20_runner.py"
      - "tests/test_dispatcher_*.py"
      - "tests/test_phase20_runner.py"
      - "scripts/phase20_test_harness.py"
      - "tests/test_phase20_test_harness.py"
      - "scripts/phase20_notebooks.py"
      - "tests/test_phase20_notebooks.py"
      - "scripts/phase20_notebook_policy.py"
      - "tests/test_phase20_notebook_policy.py"
      - "tests/fixtures/phase20_safe_notebook.ipynb"
      - "docker/phase20-notebook-runner/**"
      - "scripts/phase20_notebook_ci_acceptance.py"
      - "tests/conftest.py"
      - "tests/test_project_dashboard.py"
      - "tests/test_ui_smoke.py"
      - "tests/test_database_repository.py"
      - "tests/test_project_management.py"
      - "scripts/phase20_streamlit_browser_acceptance.py"
      - "services/**"
      - "database/runtime.py"
      - "database/repository.py"
      - "ui/**"
      - "config.py"
      - "app.py"
      - "tests/test_phase20_sqlite_safety.py"
      - "tests/test_phase20_sqlite_backup_recovery.py"
      - "services/backup_operations.py"
      - "database/connection.py"
      - "database/schema.py"
      - "scripts/phase20_notebook_sandbox.py"
      - ".github/workflows/phase20-ephemeral-runner.yml"

permissions:
  contents: read

concurrency:
  group: phase20-ephemeral-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  fixed-task-runner:
    name: Isolated fixed-task acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate runner and test harness contracts
        run: python -m pytest -q tests/test_phase20_runner.py tests/test_phase20_test_harness.py
      - name: Capture Python and dependency baseline
        run: python scripts/phase20_test_harness.py baseline
      - name: Verify intentional failure detection
        run: python scripts/phase20_test_harness.py failure-probe
      - name: Compile fixed repository scope and collect result
        run: python scripts/phase20_test_harness.py compile
      - name: Run focused dispatcher acceptance and collect result
        run: python scripts/phase20_test_harness.py focused
      - name: Run optional lint check when installed
        run: python scripts/phase20_test_harness.py lint
      - name: Run Phase 20.7 notebook safety acceptance
        run: python -m pytest -q tests/test_phase20_notebooks.py tests/test_phase20_notebook_policy.py tests/test_phase20_notebook_sandbox.py tests/test_colab_notebook_discovery.py tests/test_colab_notebook_creation.py
      - name: Build isolated notebook execution image
        run: docker build --pull=false -t phase20-notebook-runner:ci -f docker/phase20-notebook-runner/Dockerfile .
      - name: Execute harmless notebook with network disabled
        run: python scripts/phase20_notebook_ci_acceptance.py --image-id "$(docker image inspect --format='{{.Id}}' phase20-notebook-runner:ci)" --commit "$GITHUB_SHA"
      - name: Run Phase 20.8 SQLite backup and recovery safety
        run: python -m pytest -q tests/test_phase20_sqlite_safety.py tests/test_phase20_sqlite_backup_recovery.py tests/test_database_connection.py tests/test_backup_operations.py
      - name: Install isolated Chromium browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run Phase 20.9 Streamlit browser acceptance (retry after harness correction)
        run: python scripts/phase20_streamlit_browser_acceptance.py
      - name: Run full regression and collect result
        run: python scripts/phase20_test_harness.py full
      - name: Upload sanitized Streamlit browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase20-streamlit-browser-evidence
          path: reports/phase20-streamlit-browser/
          if-no-files-found: warn
          retention-days: 7
