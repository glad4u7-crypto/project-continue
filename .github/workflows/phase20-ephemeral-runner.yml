name: Phase 20 Ephemeral Fixed-Task Runner

on:
  push:
    branches: ["phase20/**"]
    paths:
      - "src/dispatcher/**"
      - "schemas/dispatcher/**"
      - "scripts/phase20_runner.py"
      - "tests/test_dispatcher_*.py"
      - "tests/test_phase20_runner.py"
      - ".github/workflows/phase20-ephemeral-runner.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/dispatcher/**"
      - "schemas/dispatcher/**"
      - "scripts/phase20_runner.py"
      - "tests/test_dispatcher_*.py"
      - "tests/test_phase20_runner.py"
      - ".github/workflows/phase20-ephemeral-runner.yml"

permissions:
  contents: read

concurrency:
  group: phase20-ephemeral-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  fixed-task-runner:
    name: Isolated fixed-task acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate runner safety contract
        run: python -m pytest -q tests/test_phase20_runner.py
      - name: Compile fixed repository scope
        run: python scripts/phase20_runner.py compile --retry-transient
      - name: Run dispatcher acceptance suite
        run: python scripts/phase20_runner.py dispatcher-tests --retry-transient
      - name: Run full regression suite
        run: python scripts/phase20_runner.py full-tests --retry-transient
