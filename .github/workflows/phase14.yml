name: Phase 14 Production Operations
on:
  pull_request:
  push:
    branches: [main, "feature/phase-14-production-deployment-operations"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-operations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Phase 14 focused tests
        run: |
          python -m pytest -q tests/test_access_control.py tests/test_backup_operations.py tests/test_operational_health.py tests/test_config.py
      - name: Full regression suite
        run: python -m pytest -q
