name: Notebook Sandbox Acceptance

on:
  push:
    branches: ["phase20/**"]
    paths:
      - "notebook-sandbox/**"
      - "scripts/notebook_sandbox.py"
      - "tests/test_notebook_sandbox.py"
      - ".github/workflows/notebook-sandbox.yml"
  pull_request:
    branches: [main]
    paths:
      - "notebook-sandbox/**"
      - "scripts/notebook_sandbox.py"
      - "tests/test_notebook_sandbox.py"
      - ".github/workflows/notebook-sandbox.yml"

permissions:
  contents: read

concurrency:
  group: notebook-sandbox-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Install Python test tools
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test sandbox network and timeout contract
        run: python -m pytest -q tests/test_notebook_sandbox.py
      - name: Build isolated notebook kernel image
        run: docker build --pull --file notebook-sandbox/Dockerfile --tag project-continue-notebook-sandbox:ci .
      - name: Verify non-root kernel runtime and pinned packages
        run: |
          docker run --rm --entrypoint python project-continue-notebook-sandbox:ci -c "import os, ipykernel, nbclient, nbformat; from scripts.notebook_container_runner import execute_notebook, write_artifact_exclusive; assert os.getuid() == 10001; print('NONROOT_KERNEL_IMAGE_AND_NOTEBOOK_RUNNER: PASS')"
      - name: Verify default-deny network policy
        shell: bash
        run: |
          set +e
          docker run --rm --network none --entrypoint python project-continue-notebook-sandbox:ci -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=2)" >/tmp/notebook-network-check.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 1 ] || ! grep -Eiq "Network is unreachable|No route to host|timed out" /tmp/notebook-network-check.log; then
            cat /tmp/notebook-network-check.log
            echo "NETWORK_DENIAL: FAIL"
            exit 1
          fi
          echo "NETWORK_DENIAL: PASS"
      - name: Audit notebook runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r notebook-sandbox/requirements.txt
