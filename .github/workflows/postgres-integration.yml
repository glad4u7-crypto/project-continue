name: PostgreSQL integration

on:
  push:
    branches:
      - main
      - feature/postgresql-database-adapter
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_continue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_continue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_CLIENT_MAJOR: "16"
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/project_continue_test
      TEST_POSTGRES_MIGRATION_DSN: postgresql://postgres:postgres@localhost:5432/project_continue_migration_test
      TEST_POSTGRES_ROLLBACK_DSN: postgresql://postgres:postgres@localhost:5432/project_continue_rollback_test
      TEST_POSTGRES_BACKUP_DSN: postgresql://postgres:postgres@localhost:5432/project_continue_backup_test
      TEST_POSTGRES_RESTORE_DSN: postgresql://postgres:postgres@localhost:5432/project_continue_restore_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create isolated migration test database
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres project_continue_migration_test
          createdb -h localhost -U postgres project_continue_rollback_test
      - name: Create isolated backup and restore test databases
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres project_continue_backup_test
          createdb -h localhost -U postgres project_continue_restore_test
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg /tmp/pgdg.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
          pg_restore --version
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full regression and PostgreSQL integration suite
        run: python -m pytest -q
