name: PostgreSQL integration

on:
  push:
    branches:
      - main
      - feature/postgresql-database-adapter
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_continue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_continue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/project_continue_test
      TEST_POSTGRES_MIGRATION_DSN: postgresql://postgres:postgres@localhost:5432/project_continue_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create isolated migration test database
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres project_continue_migration_test
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full regression and PostgreSQL integration suite
        run: python -m pytest -q
