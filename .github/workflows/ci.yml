name: Project Continue CI

on:
  push:
    branches: [main, "maintenance/**", "feature/**", "foundation/**"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: glad4u7-crypto/project-continue
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run focused test categories
        run: |
          python -m pytest -m unit -q
          python -m pytest -m integration -q
          python -m pytest -m api -q
          python -m pytest -m database -q
      - name: Run complete test suite with coverage and JUnit report
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=app --cov=config --cov=core --cov=database \
            --cov=integrations --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-09-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
