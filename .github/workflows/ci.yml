name: Project Continue CI

on:
  push:
    branches: [main, "maintenance/**", "feature/**", "foundation/**"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: glad4u7-crypto/project-continue
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run focused test categories
        run: |
          python -m pytest -m unit -q
          python -m pytest -m integration -q
          python -m pytest -m api -q
          python -m pytest -m database -q
      - name: Run complete test suite with coverage and JUnit report
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=app --cov=config --cov=core --cov=database \
            --cov=integrations --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-09-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
