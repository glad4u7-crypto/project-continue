name: Project Continue CI

on:
  push:
    branches: [main, "maintenance/**", "feature/**", "foundation/**"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: glad4u7-crypto/project-continue
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Build production container
        run: docker build --pull --tag project-continue:ci .
      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          signing_key="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker volume create project-continue-ci-data >/dev/null
          cleanup() {
            docker rm --force project-continue-ci >/dev/null 2>&1 || true
            docker volume rm project-continue-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name project-continue-ci \
            --publish 127.0.0.1:18501:8501 \
            --mount type=volume,source=project-continue-ci-data,target=/var/lib/project-continue \
            --env APP_ENV=production \
            --env LOG_LEVEL=INFO \
            --env PROJECT_CONTINUE_DB=/var/lib/project-continue/project_continue.sqlite3 \
            --env SESSION_SIGNING_KEY="$signing_key" \
            --env INITIAL_ADMIN_EMAIL=ci@example.invalid \
            --env INITIAL_ADMIN_PASSWORD='CI-only-password-123!' \
            project-continue:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18501/_stcore/health >/dev/null; then
              echo "CONTAINER HEALTH: PASS"
              exit 0
            fi
            sleep 2
          done
          docker logs project-continue-ci
          echo "CONTAINER HEALTH: FAIL"
          exit 1
      - name: Run focused test categories
        run: |
          python -m pytest -m unit -q
          python -m pytest -m integration -q
          python -m pytest -m api -q
          python -m pytest -m database -q
      - name: Run complete test suite with coverage and JUnit report
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=app --cov=config --cov=core --cov=database \
            --cov=integrations --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-09-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
