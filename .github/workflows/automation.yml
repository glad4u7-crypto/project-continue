name: Project Continue Scheduled Automation Verification
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: ["feature/phase-12-automation-engine"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile modules
        run: python -m compileall -q services ui scripts tests
      - name: Focused automation tests
        run: python -m pytest -q tests/test_automation_engine.py
      - name: Full regression suite
        run: python -m pytest -q
